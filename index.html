<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Starry Night, 250 km Deep</title>
    <meta name="description" content="From one exact point, 170,000 brushstrokes scattered through 250 km of space line up into Van Gogh's The Starry Night." />
    <style>
      :root { color-scheme: dark; --void: #050a18; --ink: #c9d3e6; }
      html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
      #app { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
      #app canvas { display: block; width: 100%; height: 100%; outline: none; }
      .fallback { position: absolute; inset: auto 16px 40% 16px; text-align: center; font: 15px/1.5 Georgia, 'Times New Roman', serif; }
      #loading-overlay {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: radial-gradient(circle at 50% 45%, #0c1836 0%, #050a18 75%);
        color: #f5e27a; font: 500 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
        letter-spacing: 0.08em; pointer-events: none; transition: opacity 0.45s ease;
      }
      #loading-overlay[data-Ready="1"] { opacity: 0; }
      .loading-star {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2px solid rgba(242, 194, 48, 0.25); border-top-color: #f2c230;
        animation: pn-spin 1.1s linear infinite;
        box-shadow: 0 0 18px rgba(242, 194, 48, 0.45);
      }
      .loading-sub { font-size: 11.5px; color: rgba(232, 237, 240, 0.68); letter-spacing: 0.04em; }
      @keyframes pn-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .loading-star { animation: none; border-color: #f2c230; } }
    </style>
  </head>
  <body>
    <div id="loading-overlay" role="status" aria-live="polite">
      <div class="loading-star"></div>
      <div>✦ 正在編織《星夜》250 公里立體筆觸世界…</div>
      <div class="loading-sub">Van Gogh's The Starry Night · 3D Impasto Cosmos</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
